<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Install Sannata</title>


<style>

:root{
    --green:#34ff8b;
    --bg:#050505;
    --card:rgba(255,255,255,.05);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:radial-gradient(circle at top,#102116,#050505);
    color:white;
    min-height:100vh;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

.hero-banner{
    width:100%;
    max-width:1000px;
    height:500px;
    object-fit:cover;
    border-radius:25px;
    margin-bottom:35px;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 0 40px rgba(52,255,139,.15);
}

.hero{
    text-align:center;
    padding:100px 20px 70px;
}

.hero h1{
    font-size:4rem;
    margin-bottom:20px;
}

.hero p{
    color:#bbb;
    max-width:700px;
    margin:auto;
    line-height:1.8;
}

.banner-section{
    width:100%;
    padding:40px 0;
}

.game-banner{
    width:100%;
    max-width:1200px;
    height:500px;
    object-fit:cover;
    display:block;
    margin:auto;
    border-radius:24px;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 0 40px rgba(52,255,139,.15);
}

.download-btn{
    margin-top:35px;
    padding:16px 35px;
    border:none;
    border-radius:14px;
    background:var(--green);
    color:black;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    transition:.3s;
}

.download-btn:hover{
    transform:translateY(-5px);
    box-shadow:0 0 30px rgba(52,255,139,.4);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
    margin-top:50px;
}

.card{
    background:var(--card);
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:30px;
    backdrop-filter:blur(20px);
}

.card h2{
    color:var(--green);
    margin-bottom:15px;
}

.card p{
    color:#ccc;
    line-height:1.8;
}

.about{
    margin-top:40px;
}

.about p{
    color:#ccc;
    line-height:2;
}

.features{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:30px;
}

.feature{
    background:var(--card);
    border-radius:18px;
    padding:25px;
    border:1px solid rgba(255,255,255,.08);
}

.feature h3{
    color:var(--green);
    margin-bottom:10px;
}

.install-section{
    text-align:center;
    margin-top:70px;
}

.install-size{
    margin-top:20px;
    color:#aaa;
}

footer{
    margin-top:90px;
    text-align:center;
    padding:40px;
    border-top:1px solid rgba(255,255,255,.08);
}

footer p{
    color:#888;
}

</style>
</head>
</html>
